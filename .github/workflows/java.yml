name: Java CI

on:
  push:
    branches: [main, modulo-01-concorrencia-multithreading]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: mvn -B verify
      - name: Exemplo executável
        run: java -cp target/classes dev.jagella.pos.concorrencia.App
